name: Deploy secure student portal

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify secure Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as repository Actions variables before deploying."
            exit 1
          fi

      - name: Extract sanitized source
        run: |
          mkdir portal
          unzip -q student-secure-source.zip -d portal
          test -f portal/package.json
          test -f portal/supabase/schema.sql

      - name: Install dependencies
        working-directory: portal
        run: npm ci

      - name: Build secure website
        working-directory: portal
        env:
          GITHUB_ACTIONS: 'true'
          VITE_REQUIRE_AUTH: 'true'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build -- --base=/student-cumulative-record-demo/

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
